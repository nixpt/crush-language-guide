name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      # Every ```crush block's Run button / label, proven against the vendored
      # crush-web build (src/play/pkg). Needs only node + python3.
      - name: Check browser classification
        run: |
          python3 scripts/fetch-pyodide
          node scripts/check-browser.mjs

      - name: Build mdBook
        run: mdbook build

      # One .crush-nb per chapter, linked from each page ("Open as a notebook").
      - name: Build chapter notebooks
        run: python3 scripts/build-notebooks.py --out book/notebooks

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
          cname: docs.crushlang.org

  interactive:
    # Headless Chromium drives the built book's Run / Edit controls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Build and test
        run: |
          mdbook build
          python scripts/build-notebooks.py --out book/notebooks
          python scripts/test-interactive.py
          python scripts/check-corpus-browser.py

  verify:
    # The examples against the real toolchain: build crush-ast at the commit in
    # CRUSH_AST_COMMIT (with buckets beside it, as crush-ast's own CI does), then
    # run the verified corpus (examples/verified/) and every block on the pages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: guide

      - name: Pinned crush-ast commit
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < guide/CRUSH_AST_COMMIT)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: nixpt/crush-ast
          ref: ${{ steps.pin.outputs.sha }}
          path: crush-ast

      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crush-ast
          key: ${{ steps.pin.outputs.sha }}

      - name: Build the toolchain
        working-directory: crush-ast
        run: cargo build -p crush-lang-sdk

      - name: Verified corpus
        run: python3 guide/scripts/verify-examples --bin-dir crush-ast/target/debug

      - name: Every block on the pages
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/crush-ast/target
        run: python3 guide/scripts/check-examples.py --bin-dir crush-ast/target/debug --crush-ast crush-ast

  notebooks:
    # Every chapter notebook: valid against crush-notebook's schema, and run
    # through the published notebook kernel (each runnable cell prints what the
    # page shows, each expected failure fails, each host-only cell is refused).
    # crush-notebook-kernel 0.2.0 is built on crush-ast 0.8.0, one release behind
    # the pinned commit (v0.9.0): cells that use 0.9.0 features (string slices,
    # hex/binary literals) fail here until a kernel built on 0.9.0 is published
    # (GUIDE-6). Bump KERNEL_VERSION with CRUSH_AST_COMMIT then.
    runs-on: ubuntu-latest
    env:
      KERNEL_VERSION: 0.2.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and validate
        run: |
          python -m pip install jsonschema
          python scripts/build-notebooks.py --out book/notebooks --validate schemas/notebook.schema.json

      - name: Cache the notebook kernel
        id: kernel
        uses: actions/cache@v4
        with:
          path: ~/.cache/crush-notebook-kernel
          key: crush-notebook-kernel-${{ env.KERNEL_VERSION }}-${{ runner.os }}

      - name: Install the notebook kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        run: cargo install --locked --root ~/.cache/crush-notebook-kernel "crush-notebook-kernel@${KERNEL_VERSION}"

      - name: Run every notebook
        shell: bash  # -o pipefail: the tee must not hide a failing run
        run: |
          python scripts/run-notebooks.py --kernel ~/.cache/crush-notebook-kernel/bin/crush-notebook-kernel \
            --dir book/notebooks --markdown | tee -a "$GITHUB_STEP_SUMMARY"
